name: W07 portable colleague review tests
on:
  push:
    branches: [main]
    paths:
      - 'R/w07-colleague-review.R'
      - 'inst/w07/review_bundle_app.R'
      - 'tests/testthat/test-w07-colleague-review.R'
      - '.github/workflows/test-w07-colleague-review.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat, any::shiny
          needs: check
      - name: Parse app and verify portable review
        run: |
          Rscript -e 'parse("inst/w07/review_bundle_app.R")'
          Rscript -e 'testthat::test_local(".", filter="w07-colleague-review")'
