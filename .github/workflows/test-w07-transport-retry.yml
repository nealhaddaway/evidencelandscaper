name: W07 transport retry regression
on:
  push:
    branches: [main]
    paths:
      - 'R/w07-trial.R'
      - 'tests/testthat/test-w07-transport-retry.R'
      - '.github/workflows/test-w07-transport-retry.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat
          needs: check
      - name: Test W07 timeout recovery
        run: Rscript -e 'testthat::test_local(".", filter="w07-transport-retry")'
