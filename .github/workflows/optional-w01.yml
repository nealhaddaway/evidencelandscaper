name: Optional W01 runner
on:
  workflow_dispatch:
    inputs:
      transfer_tag:
        description: 'Existing private release tag carrying W01 input archive'
        required: true
        type: string
permissions:
  contents: write
jobs:
  w01:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Dependencies
        run: |
          Rscript -e 'install.packages(c("remotes","jsonlite","digest","data.table","stringdist","stringi","xml2","DBI","RSQLite","httr2"))'
          Rscript -e 'remotes::install_local(".",dependencies=FALSE,upgrade="never")'
      - name: Get private transfer
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.transfer_tag }}
        run: |
          mkdir -p input
          gh release download "$TAG" --pattern 'w01-input.tar.gz' --dir input
          tar -xzf input/w01-input.tar.gz -C input
      - name: Run original W01 scripts
        run: Rscript inst/github/w01_runner.R input
      - name: Return immutable results
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.transfer_tag }}
        run: gh release upload "$TAG" w01-result.tar.gz
