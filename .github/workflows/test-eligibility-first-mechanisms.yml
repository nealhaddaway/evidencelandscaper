name: Eligibility-first mechanism integration tests
on:
  push:
    branches: [main]
    paths:
      - 'R/ostara-eligibility-first-mechanisms.R'
      - 'R/ostara-fulltext-mechanism-supplement.R'
      - 'R/ostara-supplement-review.R'
      - 'tests/testthat/test-ostara-eligibility-first-mechanisms.R'
      - '.github/workflows/test-eligibility-first-mechanisms.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat
          needs: check
      - name: Test eligibility-first full-text mechanism handover
        run: Rscript -e 'testthat::test_local(".", filter="ostara-eligibility-first-mechanisms")'
