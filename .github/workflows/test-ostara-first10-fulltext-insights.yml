name: Luna first10 fulltext mechanisms and insights tests
on:
  push:
    branches: [main]
    paths:
      - 'R/ostara-fulltext-mechanisms-all.R'
      - 'R/ostara-first10-fulltext-insights.R'
      - 'inst/w09/fulltext_insights_v1.txt'
      - 'tests/testthat/test-ostara-fulltext-mechanisms-all.R'
      - 'tests/testthat/test-ostara-first10-fulltext-insights.R'
      - '.github/workflows/test-ostara-first10-fulltext-insights.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat
          needs: check
      - name: Test independent Luna mechanisms and W08-routed insights
        run: Rscript -e 'testthat::test_local(".", filter="ostara-fulltext-mechanisms-all|ostara-first10-fulltext-insights")'
