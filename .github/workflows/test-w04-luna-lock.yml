name: W04 Luna only and checkpoint transition tests
on:
  push:
    branches: [main]
    paths:
      - 'R/w04-run.R'
      - 'R/w04-luna-transition.R'
      - 'R/w04-full.R'
      - 'inst/w04/workflow_04_luna_consensus.R'
      - 'tests/testthat/test-w04-luna-lock.R'
      - 'tests/testthat/test-w04-luna-mixed-pass.R'
      - '.github/workflows/test-w04-luna-lock.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat
          needs: check
      - name: Test Luna model lock and recovery
        run: Rscript -e 'testthat::test_local(".", filter="w04-luna")'
