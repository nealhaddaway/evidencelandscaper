name: Independent all-full-text mechanism and case-sweep tests
on:
  push:
    branches: [main]
    paths:
      - 'R/ostara-fulltext-mechanisms-all.R'
      - 'R/ostara-fulltext-mechanism-supplement.R'
      - 'R/ostara-supplement-review.R'
      - 'inst/w09/fulltext_mechanisms_supplement_v1.txt'
      - 'tests/testthat/test-ostara-fulltext-mechanisms-all.R'
      - '.github/workflows/test-all-fulltext-mechanisms.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat
          needs: check
      - name: Verify full-text inventory and independent case sweep
        run: Rscript -e 'testthat::test_local(".", filter="ostara-fulltext-mechanisms-all")'
