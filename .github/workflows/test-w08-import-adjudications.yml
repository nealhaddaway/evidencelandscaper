name: W08 colleague adjudication import tests
on:
  push:
    branches: [main]
    paths:
      - 'R/w08-import-colleague-adjudications.R'
      - 'R/w09-no-case-first10.R'
      - 'tests/testthat/test-w08-import-colleague-adjudications.R'
      - '.github/workflows/test-w08-import-adjudications.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat
          needs: check
      - name: Verify W08 review import and effective first-10-percent case selection
        run: Rscript -e 'testthat::test_local(".", filter="w08-import-colleague-adjudications|w09-no-case-first10")'
