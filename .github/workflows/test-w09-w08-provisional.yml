name: W09 provisional W08 case-positive queue
on:
  push:
    branches: [main]
    paths:
      - 'R/w09-w08-provisional.R'
      - 'tests/testthat/test-w09-w08-provisional.R'
      - '.github/workflows/test-w09-w08-provisional.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat
          needs: check
      - name: Validate W09 case-positive provisional W08 handover
        run: Rscript -e 'testthat::test_local(".", filter="w09-w08-provisional")'
