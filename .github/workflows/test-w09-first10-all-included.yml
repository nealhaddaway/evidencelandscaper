name: First ten percent all included full-text retrieval tests
on:
  push:
    branches: [main]
    paths:
      - 'R/w09-first10-all-included.R'
      - 'R/w09-openalex-content.R'
      - 'tests/testthat/test-w09-first10-all-included.R'
      - '.github/workflows/test-w09-first10-all-included.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat
          needs: check
      - name: Test full first-10-percent W09 cohort and zero-network archive reuse
        run: Rscript -e 'testthat::test_local(".", filter="w09-first10-all-included")'
