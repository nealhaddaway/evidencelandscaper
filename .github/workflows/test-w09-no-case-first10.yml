name: First 10 percent case-negative full-text retrieval tests
on:
  push:
    branches: [main]
    paths:
      - 'R/w09-no-case-first10.R'
      - 'tests/testthat/test-w09-no-case-first10.R'
      - '.github/workflows/test-w09-no-case-first10.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat
          needs: check
      - name: Validate case-negative W08 selection and retrieval preparation
        run: Rscript -e 'testthat::test_local(".", filter="w09-no-case-first10")'
